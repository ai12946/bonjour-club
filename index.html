<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonjour Club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Noto+Sans+HK:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column like a sticker notebook; sticky top bar with stars; views swap in place */
:root{
  --bg:#fff4f8; --dot:#ffe0eb; --ink:#4b2a4f; --muted:#8d6f92; --card:#ffffff; --line:#f4d6e2;
  --pink:#ff6f9f; --pink-soft:#ffd6e5; --lav:#a993ff; --lav-soft:#ece6ff;
  --mint:#4fcfae; --mint-soft:#d7f5ec; --butter:#ffcf4d; --butter-soft:#fff1c4;
  --good:#22a77e; --bad:#ff5a73;
  --f-display:'Fredoka','Noto Sans HK',ui-rounded,system-ui,sans-serif;
  --f-body:'Nunito','Noto Sans HK',system-ui,sans-serif;
  --r:22px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.6px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px dashed var(--line)}
.top-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:6px;margin-right:auto}
.brand b{color:var(--pink)}
.pill{display:flex;align-items:center;gap:5px;background:var(--butter-soft);border-radius:99px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.pill.streak{background:var(--pink-soft)}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px;display:grid;gap:18px}
.view{display:grid;gap:18px}

.card{background:var(--card);border-radius:var(--r);border:2px solid var(--line);padding:16px}
.sec-title{display:flex;align-items:baseline;gap:8px;font-size:1.15rem}
.sec-title small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:700}

/* hero */
.hero{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;background:linear-gradient(160deg,var(--pink-soft),var(--card) 70%)}
.mimi{width:100%;height:auto;display:block}
.mimi .ears{transform-origin:60px 60px;animation:wiggle 3.2s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(-4deg)}92%{transform:rotate(4deg)}}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;position:relative;font-weight:700;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .fr{font-family:var(--f-display);font-size:1.25rem;color:var(--pink);display:flex;align-items:center;gap:6px}
.bubble .zh{font-size:.9rem;color:var(--muted)}
.lvl{grid-column:1/-1;display:grid;gap:4px}
.lvl-row{display:flex;justify-content:space-between;font-size:.85rem;font-weight:800}
.lvl-row span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:var(--lav-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(45deg,var(--lav),var(--lav) 8px,#bba8ff 8px,#bba8ff 16px);transition:width .5s}

/* missions */
.missions{display:grid;gap:10px}
.mission{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.mission .lab{font-weight:800}
.mission .bar{grid-column:1;height:9px;background:var(--mint-soft)}
.mission .bar i{background:var(--mint)}
.mission .cnt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:99px;padding:9px 16px;font-weight:800;background:var(--pink);color:#fff;box-shadow:0 4px 0 #d94c7d;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d94c7d}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.small{padding:5px 12px;font-size:.85rem}
.btn[disabled]{background:var(--line);box-shadow:none;color:var(--muted);cursor:default}
.mission .btn{grid-row:1/3;grid-column:2}

/* units */
.units{display:grid;gap:12px}
.unit{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:0 5px 0 var(--line);transition:transform .12s}
.unit:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.unit .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:2rem;font-family:var(--f-display);font-weight:700}
.unit h3{font-size:1.15rem}
.unit .fr{font-family:var(--f-display);color:var(--muted);font-size:.9rem}
.unit .prog{font-size:.8rem;font-weight:800;color:var(--muted);margin-top:4px;display:grid;gap:3px}
.unit .prog .bar{height:7px}
.unit .go{font-family:var(--f-display);font-size:1.4rem;color:var(--pink)}
.t-pink{background:var(--pink-soft)} .t-mint{background:var(--mint-soft)} .t-butter{background:var(--butter-soft)} .t-lav{background:var(--lav-soft)}
.rainbow{background:conic-gradient(#ff7a7a,#ffcf4d,#6fd98a,#6fb6ff,#a993ff,#ff7aa8,#ff7a7a)}
.rainbow span{width:30px;height:30px;border-radius:50%;background:var(--card)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:.88rem;background:var(--butter-soft);border-radius:16px;padding:10px 14px;font-weight:700}

/* unit view */
.vhead{display:flex;align-items:center;gap:10px}
.back{width:42px;height:42px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:1.2rem;font-weight:800;flex:none}
.vhead h2{font-size:1.35rem}
.vhead .fr{font-family:var(--f-display);color:var(--pink);font-size:.95rem}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px}
.switch .knob{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-pressed="true"] .knob{background:var(--mint)}
.switch[aria-pressed="true"] .knob::after{left:19px}

.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.word{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;justify-items:center;text-align:center;position:relative}
.word.got{border-color:var(--mint);background:linear-gradient(var(--card),var(--mint-soft))}
.word .w-fr{font-family:var(--f-display);font-size:1.3rem;font-weight:600;color:var(--ink);line-height:1.15}
.word .w-zh{font-weight:800}
.word .w-en{font-size:.8rem;color:var(--muted)}
.word .w-tip{font-size:.78rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:4px 8px;line-height:1.35}
.word .acts{display:flex;gap:6px;margin-top:2px}
.say{width:44px;height:44px;border-radius:50%;background:var(--pink);color:#fff;font-size:1.2rem;box-shadow:0 3px 0 #d94c7d}
.say.playing{animation:pulse .6s}
@keyframes pulse{50%{transform:scale(1.15)}}
.know{border-radius:99px;padding:0 12px;height:44px;font-weight:800;font-size:.85rem;border:2px solid var(--line);background:var(--card)}
.word.got .know{background:var(--mint);border-color:var(--mint);color:#fff}

.vis{display:grid;place-items:center}
.vis.emoji{font-size:2.2rem;line-height:1}
.vis.num{font-family:var(--f-display);font-weight:700;font-size:2.4rem;color:var(--lav);line-height:1}
.vis.sw{width:46px;height:46px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.vis.sm.emoji{font-size:1.7rem} .vis.sm.num{font-size:1.9rem} .vis.sm.sw{width:36px;height:36px}

.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gbtn{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px 6px;display:grid;gap:4px;justify-items:center;box-shadow:0 5px 0 var(--line);text-align:center}
.gbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.gbtn .gi{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem}
.gbtn b{font-family:var(--f-display);font-weight:600;font-size:1rem}
.gbtn small{font-size:.72rem;color:var(--muted);font-weight:700;line-height:1.3}

/* game */
.ghead{display:flex;align-items:center;gap:10px}
.ghead h2{font-size:1.2rem;margin-right:auto}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--mint)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--pink);transform:scale(1.25)}
.stage{display:grid;gap:16px}
.prompt{display:grid;justify-items:center;gap:10px;text-align:center}
.big-say{width:96px;height:96px;border-radius:50%;background:var(--pink);color:#fff;font-size:2.6rem;box-shadow:0 6px 0 #d94c7d}
.big-say:active{transform:translateY(4px);box-shadow:0 2px 0 #d94c7d}
.prompt p{font-weight:800;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 8px;display:grid;justify-items:center;gap:6px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.opt .reveal{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:.95rem;min-height:1.4em}
.opt.ok{border-color:var(--good);background:var(--mint-soft);box-shadow:0 4px 0 var(--good)}
.opt.no{border-color:var(--bad);background:#ffe3e8;box-shadow:0 4px 0 var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{display:block;position:relative;width:100%;aspect-ratio:3/4;max-width:100%;perspective:600px;padding:0}
.mc .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.mc.open .in,.mc.done .in{transform:rotateY(180deg)}
.mc .face{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;align-content:center;gap:2px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line);padding:4px;text-align:center}
.mc .back-f{background:var(--lav);background-image:radial-gradient(rgba(255,255,255,.45) 2px,transparent 2.5px);background-size:12px 12px;border-color:var(--lav);color:#fff;font-family:var(--f-display);font-size:1.4rem}
.mc .front-f{background:var(--card);transform:rotateY(180deg)}
.mc .front-f.frside{font-family:var(--f-display);font-weight:600;font-size:clamp(.78rem,3.6vw,1.05rem);line-height:1.15;color:var(--pink);word-break:break-word}
.mc .front-f small{font-size:.72rem;font-weight:800;color:var(--ink)}
.mc.done .front-f{border-color:var(--mint);background:var(--mint-soft)}
.meminfo{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);font-size:.9rem}

.spell-q{display:grid;justify-items:center;gap:8px;text-align:center}
.spell-q .zh{font-size:1.25rem;font-weight:800}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:52px}
.slot{width:42px;height:50px;border-radius:12px;border:2px dashed var(--lav);background:var(--card);font-family:var(--f-display);font-size:1.5rem;font-weight:600;display:grid;place-items:center}
.slot.filled{border-style:solid;background:var(--lav-soft)}
.slots.no .slot{border-color:var(--bad);animation:shake .35s}
.slots.ok .slot{border-color:var(--good);background:var(--mint-soft)}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{width:46px;height:50px;border-radius:12px;background:var(--butter);font-family:var(--f-display);font-size:1.5rem;font-weight:600;box-shadow:0 4px 0 #e0a92a}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #e0a92a}
.tile.used{visibility:hidden}

.result{display:grid;justify-items:center;gap:12px;text-align:center;padding-block:10px}
.result .mimi{width:130px}
.result h2{font-size:1.6rem;color:var(--pink)}
.result .big{font-family:var(--f-display);font-size:2.2rem;font-weight:700}
.result .row{justify-content:center}

/* stickers */
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.st{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 8px;display:grid;justify-items:center;gap:4px;text-align:center}
.st .art{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:var(--butter-soft);border:3px dashed var(--butter)}
.st b{font-family:var(--f-display);font-weight:600}
.st small{font-size:.75rem;color:var(--muted);font-weight:700;line-height:1.3}
.st.locked .art{filter:grayscale(1);opacity:.35;background:var(--bg);border-color:var(--line)}
.st.locked b{color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 60px));visibility:hidden;background:var(--ink);color:#fff;border-radius:99px;padding:10px 18px;font-weight:800;z-index:20;transition:transform .3s,visibility .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:15;width:100%;height:100%}
.foot{text-align:center;font-size:.8rem;color:var(--muted)}

@media (max-width:380px){.games{grid-template-columns:1fr}.gbtn{grid-template-columns:50px 1fr;justify-items:start;text-align:left}.gbtn .gi{grid-row:1/3}.hero{grid-template-columns:86px 1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">Bonjour <b>Club</b></div>
    <div class="pill streak" id="streakPill" title="連續學習日數">🔥 <span id="streakN">1</span></div>
    <div class="pill" id="starPill" title="星星">⭐ <span id="starN">0</span></div>
  </div>
</header>

<main class="app">
  <!-- HOME -->
  <section class="view" id="v-home">
    <div class="card hero">
      <svg class="mimi" viewBox="0 0 120 130" aria-hidden="true" id="mimiSvg">
        <g class="ears">
          <ellipse cx="40" cy="34" rx="12" ry="30" fill="#fff" stroke="#4b2a4f" stroke-width="3" transform="rotate(-14 40 34)"/>
          <ellipse cx="40" cy="38" rx="5.5" ry="19" fill="#ffc2d6" transform="rotate(-14 40 38)"/>
          <ellipse cx="82" cy="34" rx="12" ry="30" fill="#fff" stroke="#4b2a4f" stroke-width="3" transform="rotate(14 82 34)"/>
          <ellipse cx="82" cy="38" rx="5.5" ry="19" fill="#ffc2d6" transform="rotate(14 82 38)"/>
        </g>
        <circle cx="61" cy="84" r="40" fill="#fff" stroke="#4b2a4f" stroke-width="3"/>
        <path d="M27 62 C34 38 88 34 96 60 C82 54 42 54 27 62Z" fill="#ff5c8a" stroke="#4b2a4f" stroke-width="3" stroke-linejoin="round"/>
        <path d="M60 41 l3 -7" stroke="#4b2a4f" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="47" cy="84" rx="4.5" ry="5.5" fill="#4b2a4f"/>
        <ellipse cx="75" cy="84" rx="4.5" ry="5.5" fill="#4b2a4f"/>
        <circle cx="48.5" cy="82" r="1.6" fill="#fff"/><circle cx="76.5" cy="82" r="1.6" fill="#fff"/>
        <ellipse cx="37" cy="97" rx="7" ry="4" fill="#ffb3c9"/>
        <ellipse cx="85" cy="97" rx="7" ry="4" fill="#ffb3c9"/>
        <path d="M58 92 l3 3 l3 -3z" fill="#ff8fb1" stroke="#4b2a4f" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M55 98 Q61 104 67 98" fill="none" stroke="#4b2a4f" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M44 122 h34" stroke="#4b2a4f" stroke-width="3" stroke-linecap="round"/>
        <path d="M46 116 h30" stroke="#a993ff" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <button class="bubble" id="bubble" aria-label="聽 Mimi 講法文">
        <span class="fr"><span id="bubFr">Bonjour !</span> 🔊</span>
        <span class="zh" id="bubZh">我係 Mimi，一齊學法文啦！㩒我聽發音</span>
      </button>
      <div class="lvl">
        <div class="lvl-row"><span id="lvlName">Lv.1 Débutante 新手</span><span id="lvlNext">0 / 40 ⭐</span></div>
        <div class="bar"><i id="lvlBar" style="width:0%"></i></div>
      </div>
    </div>

    <div class="note" id="voiceNote" hidden></div>

    <div class="card">
      <h2 class="sec-title">今日任務 <small>Missions du jour · 完成有星星</small></h2>
      <div class="missions" id="missions" style="margin-top:12px"></div>
    </div>

    <div>
      <h2 class="sec-title" style="margin-bottom:10px">單元 <small>Les leçons</small></h2>
      <div class="units" id="units"></div>
    </div>

    <button class="unit" id="toStickers">
      <span class="ic t-butter">📒</span>
      <span><h3>我嘅貼紙簿</h3><span class="fr">Mes autocollants</span><span class="prog" id="stickerProg"></span></span>
      <span class="go">›</span>
    </button>

    <p class="foot">進度只會存喺你部機度，唔使登記，亦唔會收集你嘅資料。</p>
  </section>

  <!-- UNIT -->
  <section class="view" id="v-unit" hidden>
    <div class="vhead">
      <button class="back" data-go="home" aria-label="返主頁">‹</button>
      <div><h2 id="uTitle"></h2><div class="fr" id="uFr"></div></div>
    </div>
    <div class="row">
      <button class="switch" id="slowBtn" aria-pressed="false"><span class="knob"></span>🐢 慢速發音</button>
      <span style="font-size:.85rem;color:var(--muted);font-weight:700" id="uCount"></span>
    </div>
    <p class="note" id="uIntro" hidden></p>
    <div class="words" id="words"></div>
    <div class="card">
      <h2 class="sec-title">玩遊戲 <small>Jouons ! · 玩完拎星星</small></h2>
      <div class="games" style="margin-top:12px">
        <button class="gbtn" data-game="quiz"><span class="gi t-pink">🎧</span><b>聽音揀字</b><small>聽 Mimi 講，揀啱意思</small></button>
        <button class="gbtn" data-game="memory"><span class="gi t-mint">🃏</span><b>翻牌配對</b><small>法文配中文</small></button>
        <button class="gbtn" data-game="spell"><span class="gi t-butter">🔤</span><b>拼字挑戰</b><small>㩒字母砌出生字</small></button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section class="view" id="v-game" hidden>
    <div class="ghead">
      <button class="back" id="gameBack" aria-label="離開遊戲">‹</button>
      <h2 id="gTitle"></h2>

const KEY = 'bonjourclub.v1';
const $ = id => document.getElementById(id);
function load(){
  const d = {stars:0, learned:{}, everLearned:{}, badges:{}, listens:0, streak:0, lastDay:'', daily:null, slow:false};
  try { const raw = localStorage.getItem(KEY); if (raw) Object.assign(d, JSON.parse(raw)); } catch(e){}
  return d;
}
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function dayStr(t){ const d = new Date(t); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function ensureDay(){
  const t = dayStr(Date.now());
  if (!S.daily || S.daily.date !== t) S.daily = {date:t, listen:0, game:0, perfect:0, claimed:{}};
  if (S.lastDay !== t){
    S.streak = (S.lastDay === dayStr(Date.now()-864e5)) ? S.streak + 1 : 1;
    S.lastDay = t;
  }
  if (S.streak >= 3) giveBadge('streak3');
  save();
}

/* ---------- helpers ---------- */
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const sayText = w => w.say || w.fr.replace('…','');
const spellWord = w => w.sp || w.fr;
function visual(unit, w, size){
  const s = size ? ' '+size : '';
  if (unit.kind === 'num') return `<span class="vis num${s}">${w.v}</span>`;
  if (unit.kind === 'color') return `<span class="vis sw${s}" style="--c:${w.v}"></span>`;
  return `<span class="vis emoji${s}">${w.v}</span>`;
}
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 2200); }

/* ---------- speech ---------- */
let frVoice = null, voicesLoaded = false;
const hasTTS = 'speechSynthesis' in window;
function pickVoice(){
  if (!hasTTS) return renderVoiceNote();
  const vs = speechSynthesis.getVoices();
  if (vs.length) voicesLoaded = true;
  const fr = vs.filter(v => /^fr/i.test(v.lang));
  const frFR = fr.filter(v => /fr[-_]FR/i.test(v.lang));
  frVoice = frFR.find(v => /Google|Amélie|Amelie|Audrey|Marie|Denise|Julie|Thomas/i.test(v.name)) || frFR[0] || fr[0] || null;
  renderVoiceNote();
}
function renderVoiceNote(){
  const n = $('voiceNote');
  if (!hasTTS){ n.hidden=false; n.textContent='呢個瀏覽器出唔到聲。試吓用 Chrome 或者 iPhone 嘅 Safari。'; return; }
  if (voicesLoaded && !frVoice){ n.hidden=false; n.textContent='你部機未裝法文語音，發音可能唔準。Android 可以去「設定 › 文字轉語音」加法文；iPhone 去「設定 › 輔助使用 › 語音內容 › 聲音」。'; return; }
  n.hidden = true;
}
function speak(text, btn){
  if (!hasTTS){ toast('呢個瀏覽器出唔到聲'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR'; if (frVoice) u.voice = frVoice;
  u.rate = S.slow ? 0.6 : 0.9; u.pitch = 1.1;
  speechSynthesis.speak(u);
  if (btn){ btn.classList.remove('playing'); void btn.offsetWidth; btn.classList.add('playing'); }
  S.listens++; S.daily.listen++;
  giveBadge('first_listen');
  save(); renderTop(); if (!$('v-home').hidden) renderMissions();
}
if (hasTTS){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; setTimeout(()=>{ voicesLoaded = true; pickVoice(); }, 2500); }
else renderVoiceNote();

  if (S.badges[id]) return;
  S.badges[id] = Date.now(); save();
  const b = BADGES.find(x=>x.id===id);
  setTimeout(()=>toast('新貼紙！'+b.art+' '+b.name), 300);
}

/* ---------- render: top + home ---------- */
function renderTop(){
  $('starN').textContent = S.stars; $('streakN').textContent = S.streak;
  const li = Math.min(Math.floor(S.stars/PER_LEVEL), LEVELS.length-1);
  const [fr, zh] = LEVELS[li];
  $('lvlName').textContent = `Lv.${li+1} ${fr} ${zh}`;
  if (li === LEVELS.length-1){ $('lvlNext').textContent = '最高級！'; $('lvlBar').style.width='100%'; }
  else { const inLv = S.stars - li*PER_LEVEL; $('lvlNext').textContent = `${inLv} / ${PER_LEVEL} ⭐`; $('lvlBar').style.width = (inLv/PER_LEVEL*100)+'%'; }
}
function renderMissions(){
  $('missions').innerHTML = MISSIONS.map(m=>{
    const v = Math.min(S.daily[m.id], m.goal), done = v >= m.goal, claimed = S.daily.claimed[m.id];
    const btn = claimed ? `<button class="btn small" disabled>已領取</button>`
      : done ? `<button class="btn small" data-claim="${m.id}">領 ${m.reward} ⭐</button>`
      : `<button class="btn small ghost" disabled>+${m.reward} ⭐</button>`;
    return `<div class="mission"><span class="lab">${m.label}</span>${btn}<div class="bar"><i style="width:${v/m.goal*100}%"></i></div><span class="cnt">${v} / ${m.goal}</span></div>`;
  }).join('');
}
function unitLearned(u){ return u.words.filter(w=>S.learned[w.fr]).length; }
function renderUnits(){
  $('units').innerHTML = UNITS.map((u,i)=>{
    const n = unitLearned(u), t = u.words.length;
    const ic = u.kind==='color' ? `<span class="ic rainbow"><span></span></span>` : `<span class="ic ${u.tint}">${u.icon}</span>`;
    return `<button class="unit" data-unit="${i}">${ic}<span><h3>${u.name}</h3><span class="fr">${u.fr}</span>
      <span class="prog">識咗 ${n} / ${t} 個字<span class="bar"><i style="width:${n/t*100}%"></i></span></span></span><span class="go">›</span></button>`;
  }).join('');
  const got = BADGES.filter(b=>S.badges[b.id]).length;
  $('stickerProg').textContent = `儲咗 ${got} / ${BADGES.length} 張貼紙`;
}
let bubI = 0;
$('bubble').addEventListener('click', ()=>{
  speak(BUBBLES[bubI][0].replace('’',"'"));
  bubI = (bubI+1) % BUBBLES.length;
  setTimeout(()=>{ $('bubFr').textContent = BUBBLES[bubI][0]; $('bubZh').textContent = BUBBLES[bubI][1]; }, 900);
});
$('missions').addEventListener('click', e=>{
  const id = e.target.closest('[data-claim]')?.dataset.claim; if (!id) return;
  const m = MISSIONS.find(x=>x.id===id);
  S.daily.claimed[id] = true; addStars(m.reward); renderMissions(); burst();
});
$('units').addEventListener('click', e=>{
  const b = e.target.closest('[data-unit]'); if (b) openUnit(+b.dataset.unit);
});
$('toStickers').addEventListener('click', ()=>{ renderStickers(); show('stickers'); });
document.querySelectorAll('[data-go="home"]').forEach(b=>b.addEventListener('click', ()=>goHome()));

/* ---------- views ---------- */
function show(name){
  ['home','unit','game','stickers'].forEach(v=>$('v-'+v).hidden = v!==name);
  window.scrollTo(0,0);
}
function goHome(){ renderTop(); renderMissions(); renderUnits(); show('home'); }

/* ---------- unit ---------- */
let curUnit = null;
function openUnit(i){
  curUnit = UNITS[i];
  $('uTitle').textContent = curUnit.name; $('uFr').textContent = curUnit.fr;
  $('uIntro').hidden = !curUnit.intro; $('uIntro').textContent = curUnit.intro || '';
  renderWords(); show('unit');
}
function renderWords(){
  const u = curUnit;
  $('slowBtn').setAttribute('aria-pressed', S.slow ? 'true' : 'false');
  $('uCount').textContent = `識咗 ${unitLearned(u)} / ${u.words.length}`;
  $('words').innerHTML = u.words.map((w,k)=>`<div class="word${S.learned[w.fr]?' got':''}">
      ${visual(u,w)}<span class="w-fr" lang="fr">${w.fr}</span><span class="w-zh">${w.zh}</span><span class="w-en">${w.en}</span>
      <span class="w-tip">${w.tip}</span>
      <span class="acts"><button class="say" data-say="${k}" aria-label="聽發音">🔊</button><button class="know" data-know="${k}">${S.learned[w.fr]?'識咗 ✓':'我識喇'}</button></span>
    </div>`).join('');
}
$('words').addEventListener('click', e=>{
  const s = e.target.closest('[data-say]'), k = e.target.closest('[data-know]');
  if (s){ speak(sayText(curUnit.words[+s.dataset.say]), s); return; }
  if (k){
    const w = curUnit.words[+k.dataset.know];
    if (S.learned[w.fr]) delete S.learned[w.fr];
    else {
      S.learned[w.fr] = true;
      if (!S.everLearned[w.fr]){ S.everLearned[w.fr] = true; addStars(1); }
      if (unitLearned(curUnit) === curUnit.words.length && !S.badges['unit_'+curUnit.id]){ giveBadge('unit_'+curUnit.id); addStars(5); burst(); }
    }
    save(); renderWords();
  }
});
$('slowBtn').addEventListener('click', ()=>{ S.slow = !S.slow; save(); $('slowBtn').setAttribute('aria-pressed', S.slow?'true':'false'); toast(S.slow ? '慢速發音：開' : '慢速發音：關'); });
document.querySelector('.games').addEventListener('click', e=>{
  const g = e.target.closest('[data-game]')?.dataset.game; if (!g) return;
  ({quiz:startQuiz, memory:startMemory, spell:startSpell})[g](curUnit);
});

/* ---------- game shell ---------- */
let G = null;
function gameStart(title, total){
  $('gTitle').textContent = title; G.got = 0; G.marks = [];
  $('gStars').textContent = 0; renderDots(total); show('game');
}
function renderDots(total){
  if (!total){ $('gDots').innerHTML=''; return; }
  $('gDots').innerHTML = Array.from({length:total},(_,i)=>`<i class="${G.marks[i]||(i===G.i?'now':'')}"></i>`).join('');
}
function gameStar(){ G.got++; $('gStars').textContent = G.got; addStars(1); }
$('gameBack').addEventListener('click', ()=>{ if (hasTTS) speechSynthesis.cancel(); G = null; openUnit(UNITS.indexOf(curUnit)); });
function finishGame(perfect, line){
  S.daily.game++;
  let bonus = 0;
  if (perfect){ S.daily.perfect++; giveBadge('perfect'); bonus = 3; addStars(bonus); burst(); }
  save();
  const head = perfect ? 'Parfait ! 滿分！' : (G.got >= (G.total||1)/2 ? 'Bravo ! 好叻！' : 'Courage ! 加油！');
  $('gDots').innerHTML = '';
  $('stage').innerHTML = `<div class="card result">
      ${$('mimiSvg').outerHTML.replace('id="mimiSvg"','')}
      <h2>${head}</h2>
      <p class="big">⭐ +${G.got + bonus}</p>
      <p style="font-weight:700;color:var(--muted)">${line}${perfect?'<br>滿分額外送 3 粒星！':''}</p>
      <div class="row"><button class="btn" id="again">再玩一次</button><button class="btn ghost" id="toUnit">返單元</button></div>
    </div>`;
  const kind = G.type;
  speak(perfect ? 'Parfait !' : 'Bravo !');
  $('again').onclick = ()=>({quiz:startQuiz, memory:startMemory, spell:startSpell})[kind](curUnit);
  $('toUnit').onclick = ()=>{ G=null; openUnit(UNITS.indexOf(curUnit)); };
}

/* ---------- game 1: listen & pick ---------- */
function startQuiz(u){
  G = {type:'quiz', qs:shuffle(u.words).slice(0,8), i:0, lock:false};
  G.total = G.qs.length;
  gameStart('聽音揀字', G.total); renderQuiz();
}
function renderQuiz(){
  const q = G.qs[G.i];
  G.opts = shuffle([q, ...shuffle(curUnit.words.filter(w=>w!==q)).slice(0,3)]);
  G.lock = false; renderDots(G.total);
  $('stage').innerHTML = `<div class="prompt"><button class="big-say" id="replay" aria-label="再聽一次">🔊</button><p>第 ${G.i+1} 題：Mimi 講緊咩？㩒喇叭可以再聽</p></div>
    <div class="opts">${G.opts.map((w,k)=>`<button class="opt" data-opt="${k}">${visual(curUnit,w,'sm')}<span>${w.zh}</span><span class="reveal" lang="fr"></span></button>`).join('')}</div>`;
  $('replay').onclick = ()=>speak(sayText(q));
  setTimeout(()=>{ if (G && G.type==='quiz') speak(sayText(q)); }, 350);
}
$('stage').addEventListener('click', e=>{
  if (!G) return;
  if (G.type==='quiz'){
    const b = e.target.closest('[data-opt]'); if (!b || G.lock) return;
    G.lock = true;
    const q = G.qs[G.i], pick = G.opts[+b.dataset.opt], ok = pick === q;
    document.querySelectorAll('.opt').forEach((el,k)=>{ el.querySelector('.reveal').textContent = G.opts[k].fr; if (G.opts[k]===q) el.classList.add('ok'); });
    if (ok) gameStar(); else b.classList.add('no');
    G.marks[G.i] = ok ? 'ok' : 'no';
    setTimeout(()=>{ if (!G || G.type!=='quiz') return; G.i++; if (G.i < G.total) renderQuiz(); else finishGame(G.got===G.total, `答啱 ${G.got} / ${G.total} 題`); }, ok ? 900 : 1600);
  }
  else if (G.type==='memory') memClick(e);
  else if (G.type==='spell') spellClick(e);
});

/* ---------- game 2: memory ---------- */
function startMemory(u){
  const ws = shuffle(u.words).slice(0,6);
  G = {type:'memory', cards:shuffle(ws.flatMap(w=>[{w,side:'fr'},{w,side:'pic'}])), open:[], moves:0, pairs:0, total:0};
  gameStart('翻牌配對', 0); renderMemory();
}
function renderMemory(){
  $('stage').innerHTML = `<div class="meminfo"><span>將法文同意思配對</span><span id="memMoves">翻咗 0 次</span></div>
    <div class="mem">${G.cards.map((c,k)=>`<button class="mc" data-mc="${k}" aria-label="卡 ${k+1}"><span class="in">
      <span class="face back-f">?</span>
      ${c.side==='fr' ? `<span class="face front-f frside" lang="fr">${c.w.fr}</span>` : `<span class="face front-f">${visual(curUnit,c.w,'sm')}<small>${c.w.zh}</small></span>`}
    </span></button>`).join('')}</div>`;
}
function memClick(e){
  const b = e.target.closest('[data-mc]'); if (!b) return;
  const k = +b.dataset.mc, c = G.cards[k];
  if (G.open.length===2 || c.done || G.open.includes(k)) return;
  b.classList.add('open'); G.open.push(k);
  if (c.side==='fr') speak(sayText(c.w));
  if (G.open.length===2){
    G.moves++; $('memMoves').textContent = `翻咗 ${G.moves} 次`;
    const [a,z] = G.open.map(i=>G.cards[i]);
    const els = G.open.map(i=>document.querySelector(`[data-mc="${i}"]`));
    if (a.w === z.w){
      a.done = z.done = true; G.pairs++;
      setTimeout(()=>{ els.forEach(el=>el.classList.add('done')); G.open = []; gameStar(); if (a.side!=='fr') speak(sayText(a.w));
        if (G.pairs===6){ const p = G.moves <= 8; if (G.moves<=10) giveBadge('memory'); G.total = 6; setTimeout(()=>finishGame(p, `用咗 ${G.moves} 步完成（8 步內算滿分）`), 700); } }, 450);
    } else setTimeout(()=>{ els.forEach(el=>el.classList.remove('open')); G.open = []; }, 1000);
  }
}

/* ---------- game 3: spelling ---------- */
function startSpell(u){
  const pool = u.words.filter(w=>/^[a-zàâçéèêëîïôûùüœ]+$/i.test(spellWord(w)) && spellWord(w).length>=2 && spellWord(w).length<=9);
  G = {type:'spell', qs:shuffle(pool).slice(0,5), i:0, miss:0};
  G.total = G.qs.length;
  gameStart('拼字挑戰', G.total); renderSpell();
}
function renderSpell(){
  const q = G.qs[G.i], word = spellWord(q).toLowerCase();
  const decoys = shuffle('aeiourlnst'.split('').filter(ch=>!word.includes(ch))).slice(0,2);
  G.target = word; G.tiles = shuffle([...word, ...decoys]); G.picked = []; G.tryMiss = false;
  renderDots(G.total);
  $('stage').innerHTML = `<div class="card spell-q">${visual(curUnit,q)}<span class="zh">${q.zh}</span>${q.sp ? `<span style="font-family:var(--f-display);color:var(--pink);font-size:1.1rem" lang="fr">${q.fr.replace(q.sp,'＿＿')}</span>` : ''}
      <button class="btn ghost small" id="spellHear">🔊 聽發音</button><span style="font-size:.85rem;color:var(--muted);font-weight:700">${word.length} 個字母 · 㩒格仔可以退返</span></div>
    <div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>`;
  $('spellHear').onclick = ()=>speak(sayText(q));
  drawSpell();
  setTimeout(()=>{ if (G && G.type==='spell') speak(sayText(q)); }, 350);
}
function drawSpell(){
  $('slots').innerHTML = [...G.target].map((_,i)=>{ const t = G.picked[i]; return `<button class="slot${t!==undefined?' filled':''}" data-slot="${i}">${t!==undefined?G.tiles[t]:''}</button>`; }).join('');
  $('tiles').innerHTML = G.tiles.map((ch,i)=>`<button class="tile${G.picked.includes(i)?' used':''}" data-tile="${i}">${ch}</button>`).join('');
}
function spellClick(e){
  const t = e.target.closest('[data-tile]'), s = e.target.closest('[data-slot]');
  if (G.lock) return;
  if (s){ const i = +s.dataset.slot; if (G.picked[i]!==undefined){ G.picked.splice(i); drawSpell(); } return; }
  if (!t) return;
  const ti = +t.dataset.tile; if (G.picked.includes(ti)) return;
  G.picked.push(ti); drawSpell();
  if (G.picked.length === G.target.length){
    const ans = G.picked.map(i=>G.tiles[i]).join('');
    if (ans === G.target){
      G.lock = true; $('slots').classList.add('ok'); gameStar(); speak(sayText(G.qs[G.i]));
      G.marks[G.i] = G.tryMiss ? 'no' : 'ok';
      setTimeout(()=>{ if (!G || G.type!=='spell') return; G.lock=false; G.i++; if (G.i < G.total) renderSpell(); else finishGame(G.miss===0, `拼啱 ${G.total} 個字，錯咗 ${G.miss} 次`); }, 1100);
    } else {
      G.lock = true; G.miss++; G.tryMiss = true; $('slots').classList.add('no');
      setTimeout(()=>{ G.lock=false; G.picked=[]; $('slots').classList.remove('no'); drawSpell(); }, 700);
    }
  }
}

/* ---------- stickers ---------- */
function renderStickers(){
  $('stickers').innerHTML = BADGES.map(b=>`<div class="st${S.badges[b.id]?'':' locked'}"><span class="art">${b.art}</span><b>${b.name}</b><small>${S.badges[b.id]?'已獲得 ✓':b.desc}</small></div>`).join('');
}

/* ---------- confetti ---------- */
function burst(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('confetti'), cx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ff6f9f','#a993ff','#4fcfae','#ffcf4d','#ffb3c9'];
  const ps = Array.from({length:70},()=>({x:innerWidth/2, y:innerHeight*0.35, vx:(Math.random()-.5)*9, vy:-Math.random()*9-3, r:Math.random()*5+4, c:cols[Math.random()*5|0], a:Math.random()*6, heart:Math.random()<.35}));
  let f = 0;
  (function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.28; p.a+=.1; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c;
      if (p.heart){ cx.font = (p.r*3)+'px sans-serif'; cx.fillText('♥',-p.r,p.r); } else cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      cx.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else cx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ---------- boot ---------- */
ensureDay();
goHome();
</script>
